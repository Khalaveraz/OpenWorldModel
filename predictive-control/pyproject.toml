[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-control"
version = "0.1.0"
description = "Stage 1 predictive-control physics and observed-data foundations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "gymnasium==1.3.0",
    "pymunk==7.3.0",
    "numpy>=2,<3",
    "Pillow>=10,<13",
]

[project.scripts]
predictive-control = "predictive_control.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
